<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تتبع الطلب</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
 <link rel="stylesheet" href="../../assets/css/customer.css" />
</head>

<body class="bg-gray-100 min-h-screen">

  <div id="navbar"></div>

  <main class="container mx-auto px-4 py-8 max-w-3xl">
    <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-2 flex items-center">
      <i class="fas fa-truck text-green-600 mr-3"></i>
      تتبع حالة الطلب
    </h2>

    <div class="bg-white p-6 rounded-xl shadow">
      <p class="mb-4 text-gray-700">
        رقم الطلب: <span id="order-id" class="font-bold"></span>
      </p>

      <div id="order-status" class="text-center text-xl font-bold py-4 rounded-lg">
        جاري التحميل...
      </div>

      <button
        id="refresh-btn"
        class="mt-6 w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
        تحديث الحالة
      </button>
    </div>
  </main>

  <div id="footer"></div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/track-order.js"></script>

  <script>
    async function includeComponent(id, file) {
      const html = await fetch(file).then(res => res.text());
      document.getElementById(id).innerHTML = html;
    }

    document.addEventListener("DOMContentLoaded", () => {
       includeComponent("navbar", "../../components/navbar.html");
      includeComponent("footer", "../../components/footer.html");
    });
  </script>

</body>
</html>
