<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلباتي السابقة</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/customer.css" />
</head>

<body class="bg-gray-100 min-h-screen">

  <div id="navbar"></div>

  <main class="container mx-auto px-4 py-8">
    <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-2 flex items-center">
      <i class="fas fa-history text-green-600 mr-3"></i>
      سجل الطلبات
    </h2>

    <div id="orders" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p id="loading-message" class="hidden col-span-full text-center text-lg text-gray-500">
        جاري تحميل الطلبات...
      </p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/order-history.js"></script>

  <script>
    async function includeComponent(id, file) {
      const html = await fetch(file).then(res => res.text());
      document.getElementById(id).innerHTML = html;
    }

    document.addEventListener("DOMContentLoaded", () => {
      includeComponent("navbar", "../components/navbar.html");
      includeComponent("footer", "../components/footer.html");
    });
  </script>

</body>
</html>
