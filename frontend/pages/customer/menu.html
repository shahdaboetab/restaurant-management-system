<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة الطعام - Customer</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/customer.css" />
</head>

<body class="bg-gray-100 min-h-screen">

  <div id="navbar"></div>

  <main class="container mx-auto px-4 py-8">
    <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-2 flex items-center">
      <i class="fas fa-utensils text-green-600 mr-3"></i>
      قائمة الطعام
    </h2>

    <div id="categories" class="flex flex-wrap gap-2 mb-4"></div>

    <div id="menu-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p id="loading-message" class="hidden col-span-full text-center text-lg text-gray-500">جاري تحميل القائمة...</p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/customer.js"></script>

  <script>
    async function includeComponent(id, file) {
      try {
        const html = await fetch(file).then(res => res.text());
        document.getElementById(id).innerHTML = html;
      } catch (error) {
        console.error("Error loading component:", error);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      includeComponent("navbar", "../components/navbar.html");
      includeComponent("footer", "../components/footer.html");
    });
  </script>
</body>

</html>
